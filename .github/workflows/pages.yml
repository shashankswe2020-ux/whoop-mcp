name: Deploy Pages

# whoopconnector.com is still served by this repository's GitHub Pages. The
# site source lives in the private whoop-mcp-site repository; this workflow
# checks it out with a read-only deploy key, verifies it, refreshes the public
# download and star counts, and deploys the result.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy production site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out site source
        uses: actions/checkout@v7
        with:
          repository: shashankswe2020-ux/whoop-mcp-site
          ssh-key: ${{ secrets.SITE_DEPLOY_KEY }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify site
        run: |
          npm run lint
          npm run site:check
          npm test

      - name: Refresh public project statistics
        run: npm run site:stats
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
