<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>WHOOP race performance</title>
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <header class="top">
      <div class="top-inner">
        <div class="masthead">
          <h1>Race performance</h1>
          <p class="masthead-meta">HYROX and triathlon · runs on this computer only</p>
        </div>
        <nav role="tablist" aria-label="Dashboard views" id="tabs">
          <button role="tab" id="tab-session" aria-controls="main" data-view="session">
            Session
          </button>
          <button role="tab" id="tab-hyrox" aria-controls="main" data-view="hyrox">HYROX</button>
          <button role="tab" id="tab-triathlon" aria-controls="main" data-view="triathlon">
            Triathlon
          </button>
          <button role="tab" id="tab-readiness" aria-controls="main" data-view="readiness">
            Readiness
          </button>
          <button role="tab" id="tab-audit" aria-controls="main" data-view="audit">Audit</button>
        </nav>
      </div>
    </header>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <main id="main" role="tabpanel" tabindex="-1">
      <noscript>This dashboard needs JavaScript.</noscript>
    </main>
    <footer class="foot">
      <p>
        Built from your WHOOP data and the corrections you make here. Each figure lists the rule and
        inputs behind it, and the Audit tab lets you correct or challenge any of them. Not medical
        advice.
      </p>
    </footer>
  </body>
</html>
