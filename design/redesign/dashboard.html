<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Race performance</title>
<style>
@font-face{font-family:"Archivo";font-weight:400;src:url(fonts/archivo-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Archivo";font-weight:500;src:url(fonts/archivo-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Archivo";font-weight:600;src:url(fonts/archivo-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Archivo";font-weight:700;src:url(fonts/archivo-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Archivo Narrow";font-weight:500;src:url(fonts/archivo-narrow-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Archivo Narrow";font-weight:600;src:url(fonts/archivo-narrow-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Archivo Narrow";font-weight:700;src:url(fonts/archivo-narrow-latin-700-normal.woff2) format("woff2")}

:root{
  color-scheme:dark;
  --bg:#0c0e13; --panel:#141821; --panel-2:#1b2030; --line:#262c3a; --grid:#1f2431;
  --ink:#f1f3f7; --ink-2:#b8bfcc; --faint:#7c8597;
  /* heart-rate intensity: one cool-to-hot ramp used by every chart (lightness rises with effort) */
  --z0:#3a3f52; --z1:#4f46c8; --z2:#9b3fc4; --z3:#e0457b; --z4:#f7843b; --z5:#ffd84a;
  /* recovery, WHOOP's own convention */
  --red:#e5484d; --yellow:#f5c518; --green:#30c85e; --none:#3a3f52;
  /* sports (validated categorical) */
  --lift:#3987e5; --walk:#199e70; --cardio:#9085e9; --run:#d95926;
  --text:"Archivo",system-ui,sans-serif; --num:"Archivo Narrow","Arial Narrow",sans-serif;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#eef0f4; --panel:#ffffff; --panel-2:#f3f5f9; --line:#dfe3ea; --grid:#eceff4;
  --ink:#0f1320; --ink-2:#3d4557; --faint:#6a7386;
  --z0:#c9cdd8; --z1:#5b52d6; --z2:#9a3cc6; --z3:#d63a70; --z4:#e9711f; --z5:#d9a800;
  --red:#d7263d; --yellow:#d9a800; --green:#1f9d46; --none:#c9cdd8;
  --lift:#2a78d6; --walk:#1baf7a; --cardio:#6250d6; --run:#eb6834;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--text)}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--z5);outline-offset:2px}
.n{font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:600}

/* top bar */
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brand{font-weight:700;font-size:16px;margin-right:4px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.tab{appearance:none;border:0;background:none;padding:8px 14px;border-radius:999px;cursor:pointer;color:var(--ink-2);font-weight:500;white-space:nowrap}
.tab:hover{color:var(--ink);background:var(--panel)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.status{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:13px;color:var(--ink-2);flex-wrap:wrap;min-width:0}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;display:inline-block}
.theme{appearance:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 10px;cursor:pointer;font-size:13px;color:var(--ink-2)}

main{max-width:1240px;margin:0 auto;padding:24px 24px 64px}
.grid{display:grid;gap:16px}
.g-hero{grid-template-columns:320px 1fr}
.g2{grid-template-columns:1fr 1fr}
.g-32{grid-template-columns:3fr 2fr}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 20px 16px;min-width:0;position:relative}
.card h2{font-size:15px;font-weight:600;color:var(--ink)}
.card .sub{color:var(--faint);font-size:13px;margin-top:2px}
.card header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:12px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend i.ln{height:2px;width:14px;border-radius:1px}
.title{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:4px 0 18px}
.title h1{font-size:28px;font-weight:700;letter-spacing:-.015em}
.title p{color:var(--ink-2)}

svg{display:block;width:100%;height:auto;overflow:visible}
svg text{font-family:var(--text);font-size:11px;fill:var(--faint)}
svg .num{font-family:var(--num);font-weight:600;fill:var(--ink)}
svg .lab{fill:var(--ink-2);font-weight:500}
svg .hot{fill:var(--ink);font-weight:600;font-size:12px}
.hit{fill:transparent;cursor:crosshair}

.tip{position:fixed;z-index:20;pointer-events:none;background:var(--ink);color:var(--bg);padding:8px 10px;border-radius:8px;font-size:12px;line-height:1.4;max-width:260px;opacity:0;transform:translate(-50%,calc(-100% - 12px));transition:opacity .08s}
.tip.on{opacity:1}
.tip b{font-weight:700}
.tip .row{display:flex;justify-content:space-between;gap:14px}
.tip .row i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}

/* ring numbers */
.big{font-family:var(--num);font-weight:700;font-size:64px;line-height:1;letter-spacing:-.02em}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;margin-top:16px}
.stat .v{font-family:var(--num);font-weight:700;font-size:26px;line-height:1}
.stat .l{font-size:12px;color:var(--faint);margin-top:3px}
.stat .d{font-size:12px;margin-top:2px}
.down{color:var(--red)}.up{color:var(--green)}
.note{font-size:13px;color:var(--ink-2);margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.note b{color:var(--ink)}
.callouts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:12px}
.callout{border-left:3px solid var(--z3);padding:2px 0 2px 12px}
.callout b{display:block;font-size:14px}
.callout span{font-size:13px;color:var(--ink-2)}
.list{display:grid;gap:10px}
.li{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:baseline;font-size:14px}
.li i{width:10px;height:10px;border-radius:50%;display:inline-block;transform:translateY(1px)}
.li span{color:var(--ink-2);font-size:13px}
.btn{appearance:none;border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{text-align:left;padding:8px 8px 8px 0;border-bottom:1px solid var(--line)}
th{color:var(--faint);font-weight:500}

@media (prefers-reduced-motion:reduce){.draw{animation:none!important}}
@keyframes reveal{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.draw{animation:reveal 1.4s cubic-bezier(.2,.7,.2,1) both}

@media (max-width:980px){.g-hero,.g2,.g-32{grid-template-columns:1fr}.callouts{grid-template-columns:1fr 1fr}}
@media (max-width:600px){.top-in{padding:10px 14px;gap:10px}.status{margin-left:0;width:100%}main{padding:16px 12px 48px}.card{padding:16px 14px 12px}.title h1{font-size:22px}.big{font-size:52px}.callouts{grid-template-columns:1fr}}
</style>
</head>
